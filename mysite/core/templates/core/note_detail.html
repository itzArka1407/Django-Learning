<!DOCTYPE html>
<html>

<head>
    <title>{{ note.title }}</title>
</head>

<body>
    <p><a href="{% url 'core:note_list' %}">← Back to all notes</a></p>

    <h1>{{ note.title }}</h1>

    <p><small>Created: {{ note.created_at }}</small></p>
    <p><small>Updated: {{ note.updated_at }}</small></p>

    <hr>

    <p>{{ note.body }}</p>
</body>

</html>
