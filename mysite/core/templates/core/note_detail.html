{% extends "core/base.html" %}

{% block title %}{{ note.title }}{% endblock %}

{% block content %}
    <h1>{{ note.title }}</h1>

    <p><small>By {{ note.author.username }} — {{ note.created_at }}</small></p>

    <hr>

    <p>{{ note.body }}</p>

    {% if user == note.author %}
        <p>
            <a href="{% url 'core:note_edit' pk=note.pk %}">Edit</a>
            |
            <a href="{% url 'core:note_delete' pk=note.pk %}">Delete</a>
        </p>
    {% endif %}
{% endblock %}
