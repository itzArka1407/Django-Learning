{% extends "core/base.html" %}

{% block title %}{{ note.title }}{% endblock %}

{% block content %}
    <h1>{{ note.title }}</h1>

    <div class="meta">
        By {{ note.author.username }} — {{ note.created_at|date:"F j, Y" }}
    </div>

    <div class="note-body">{{ note.body }}</div>

    {% if user == note.author %}
        <div class="actions">
            <a href="{% url 'core:note_edit' pk=note.pk %}">Edit</a>
            <a href="{% url 'core:note_delete' pk=note.pk %}">Delete</a>
        </div>
    {% endif %}
{% endblock %}
