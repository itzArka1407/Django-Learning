{% extends "core/base.html" %}

{% block content %}
    <h1>My Notes</h1>

    {% if notes %}
        <ul class="notes">
            {% for note in notes %}
                <li>
                    <a href="{% url 'core:note_detail' pk=note.pk %}">{{ note.title }}</a>
                    <div class="meta">
                        By {{ note.author.username }} — {{ note.created_at|date:"F j, Y" }}
                    </div>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No notes yet. <a href="{% url 'core:note_create' %}">Create the first one</a>.</p>
    {% endif %}
{% endblock %}
